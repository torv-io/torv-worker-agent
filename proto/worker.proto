syntax = "proto3";

package worker;

option go_package = "torv.io/worker-agent/proto";

service WorkerService {
  rpc Subscribe(stream WorkerMessage) returns (stream OrchestratorMessage);
}

// ── worker → orchestrator ──
message WorkerMessage {
  string worker_id = 1;
  oneof type {
    Session session = 2;
    Heartbeat heartbeat = 3;
    RunLog log = 5;
    RunResult result = 6;
  }
}

message Session {
  string workspace_id = 1;
  string token = 2;
}

message Heartbeat {
  string status = 1;
}

message RunLog {
  string run_id = 1;
  string level = 2;
  string message = 3;
}

message RunResult {
  string run_id = 1;
  string status = 2;
  int32 code = 3;
  optional string error = 4;
  optional string outputs_json = 5;
}

// ── orchestrator → worker ──
message OrchestratorMessage {
  oneof body {
    SessionReady session = 1;
    RunDispatch dispatch = 2;
    RunAbort abort = 3;
  }
}

message SessionReady {
  string worker_id = 1;
  string error = 2;
}

message RunDispatch {
  string run_id = 1;
  string stage_id = 2;
  string runner_id = 3;
  string runner_type = 4;
  string code_url = 5;
  string config_url = 6;
  string params_json = 7;
  string inputs_url = 8;
}

message RunAbort {
  string run_id = 1;
  string reason = 2;
}
