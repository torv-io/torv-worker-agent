syntax = "proto3";

package agent;

option go_package = "torv.io/worker-agent/proto";

service AgentService {
  rpc Subscribe(stream AgentRequest) returns (stream AgentResponse);
}

// ------------------------------------------------------------
// REQUEST
// ------------------------------------------------------------

enum RequestType {
  REQUEST_TYPE_UNSPECIFIED = 0;
  REQUEST_TYPE_REGISTER = 1;
  REQUEST_TYPE_HEARTBEAT = 2;
  REQUEST_TYPE_STAGE_RUN_MESSAGE = 3;
  REQUEST_TYPE_HANDLE_STAGE_START = 4;
  REQUEST_TYPE_HANDLE_STAGE_FINISH = 5;
}

message AgentRequest {
  RequestType type = 1;
  oneof body {
    RegisterBody register = 2;
    HeartbeatBody heartbeat = 3;
    StageRunMessageBody stage_run_message = 4;
    HandleStageStartBody handle_stage_start = 5;
    HandleStageFinishBody handle_stage_finish = 6;
  }
}

message RegisterBody {
  string secret = 1;
  string address = 2;
}

message HeartbeatBody {
  string worker_id = 1;
  string status = 2;
}

message StageRunMessageBody {
  string worker_id = 1;
  string stage_run_id = 2;
  string message = 3;
  string level = 4;
}

message HandleStageStartBody {
  string worker_id = 1;
  string stage_run_id = 2;
  string message = 3;
}

message HandleStageFinishBody {
  string stage_run_id = 1;
  int32 status = 2;
  string error = 3;
  map<string, string> outputs = 4;
}

// ------------------------------------------------------------
// RESPONSE
// ------------------------------------------------------------

enum ResponseType {
  RESPONSE_TYPE_REGISTER = 0;
  RESPONSE_TYPE_HEARTBEAT = 1;
  RESPONSE_TYPE_STAGE_RUN_MESSAGE = 2;
  RESPONSE_TYPE_WORK_ITEM = 3;
}

message AgentResponse {
  ResponseType type = 1;
  oneof body {
    RegisterResponseBody register = 2;
    HeartbeatResponseBody heartbeat = 3;
    StageRunMessageResponseBody stage_run_message = 4;
    WorkItemBody work_item = 5;
  }
}

message RegisterResponseBody {
  bool success = 1;
  string worker_id = 2;
  string error = 3;
}

message HeartbeatResponseBody {
  bool success = 1;
  string assigned_worker_id = 2;
}

message StageRunMessageResponseBody {
  bool success = 1;
}

message WorkItemBody {
  string stage_id = 1;
  string stage_run_id = 2;
  string runner_type = 3;
  string code_presigned_url = 4;
  string config_presigned_url = 5;
  string context_json = 6;
}
